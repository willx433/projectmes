name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # WeasyPrint system libs needed in Phase 2; uncomment then
      # - name: Install WeasyPrint system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0

      - name: Lint with ruff
        run: ruff check app tests migrations tools

      - name: Run tests
        run: pytest tests -q

      - name: Guard against legacy imports
        run: |
          if grep -rn "from legacy\|import legacy" app tests tools; then
            echo "ERROR: legacy imports detected"
            exit 1
          else
            echo "✓ No legacy imports found"
          fi

      - name: Guard against tracked .env file
        run: |
          if git ls-files | grep -x '.env'; then
            echo "ERROR: .env file is tracked in git"
            exit 1
          else
            echo "✓ .env file is properly gitignored"
          fi
