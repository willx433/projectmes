<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Atlas MES{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="wordmark">Atlas <span>MES</span></div>
    <span class="title">{% block header_title %}{% endblock %}</span>
    <nav class="appnav">
      <a href="/admin/health">Health</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/library">Library</a>
      <a href="/admin/work-orders">Work Orders</a>
      <a href="/admin/units">Units</a>
      <a href="/admin/kitup">Kit-up</a>
      <a href="/admin/boxes">Boxes</a>
      <a href="/admin/stations">Stations</a>
      <a href="/admin/operators">Operators</a>
    </nav>
  </header>
  <main class="page">
    {% if error %}<div class="banner banner-error">{{ error }}</div>{% endif %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
